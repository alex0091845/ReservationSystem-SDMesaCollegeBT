# ── Supabase ──────────────────────────────────────────────────
# Supabase Dashboard → Project Settings → API
supabase.url=${SUPABASE_URL}
supabase.api-key=${SUPABASE_API_KEY}

# ── Server ────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# Never leak internal error detail (messages, stack traces) to clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Cookie/session auth
auth.cookie.name=session_id
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.session.hours=${AUTH_SESSION_HOURS:8}

# Use exact deployed frontend origins when possible, for example:
# app.cors.allowed-origin-patterns=https://your-frontend.example.com,http://localhost:5500
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS}

# ── Closure notification emails ───────────────────────────────
# disabled queues notices without sending them, mock marks them sent without
# sending anything (local development only), smtp sends through a real server.
notifications.email.provider=${EMAIL_PROVIDER:disabled}
notifications.email.from=${EMAIL_FROM:}
notifications.email.smtp.host=${EMAIL_SMTP_HOST:}
notifications.email.smtp.port=${EMAIL_SMTP_PORT:587}
notifications.email.smtp.username=${EMAIL_SMTP_USERNAME:}
notifications.email.smtp.password=${EMAIL_SMTP_PASSWORD:}
notifications.email.smtp.starttls=${EMAIL_SMTP_STARTTLS:true}
notifications.poll-seconds=${NOTIFICATION_POLL_SECONDS:60}
# Shown in faculty emails. Set this to the real contact before enabling sending.
notifications.contact-instructions=${EMAIL_CONTACT_INSTRUCTIONS:Please contact the BT-216 administration if you need help with alternative arrangements.}
